{% extends "registration/_auth_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="card mt-5 mx-auto" style="max-width: 500px;">
	<div class="card-body">
		<h2 class="mb-3">Reset Password</h2>
		<p>Enter your email address below and we will send you instructions to reset your password.</p>
		<form method="post">
			{% csrf_token %}
			{{ form|crispy }}
			<button type="submit" class="btn btn-outline-danger w-100">Send reset link</button>
		</form>
	</div>
</div>
{% endblock %}
