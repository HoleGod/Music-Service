{% extends 'registration/_auth_base.html' %}

{% block title %}Login{% endblock title %}
{% load crispy_forms_tags %}

{% block content %}
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <p>Don't have an account? Create one <a href="/app/sign-up">here</a>!</p>
    <button type="submit" class="btn btn-outline-success">Login</button>
</form>

<p class="mt-2">
    <a href="{% url 'password_reset' %}" class="btn btn-outline-danger btn-sm">Reset Password</a>
</p>

{% endblock content %}
