{% extends "registration/_auth_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<div class="card mt-5 mx-auto" style="max-width: 500px;">
	<div class="card-body">
		<h2 class="mb-3">Set a New Password</h2>
		<form method="post">
			{% csrf_token %}
			{{ form|crispy }}
			<button type="submit" class="btn btn-outline-success w-100">Change my password</button>
		</form>
	</div>
</div>
{% endblock %}
